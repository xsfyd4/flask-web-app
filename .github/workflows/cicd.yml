name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false

  deploy:
    name: 自动化部署到服务器
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to Touge Server via SSH (Port 46250)
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.TOUGE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 46250 -H ${{ secrets.TOUGE_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH环境配置完成，尝试连接服务器..."
          ssh -p 46250 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
              root@${{ secrets.TOUGE_SERVER_IP }} <<'EOF'
          set -e
          echo "成功连接服务器: $(whoami)@$(hostname)"
          cd /root/flask-web-app || { echo "项目目录不存在"; exit 1; }
          for i in 1 2 3 4 5; do
            if git pull origin main; then break; fi
            echo "第 $i 次 git pull 失败，5 秒后重试"
            sleep 5
          done
          pip3 install -r requirements.txt
          service supervisor start || true
          supervisorctl restart flask-web-app || supervisorctl start flask-web-app
          sleep 2
          supervisorctl status flask-web-app
          curl -s -o /dev/null -w "服务自检 http://127.0.0.1:5000 -> %{http_code}\n" http://127.0.0.1:5000/
          echo "部署完成"
          EOF
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
